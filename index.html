<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1780e6">
<meta name="description" content="Joan Labbé digital business card.">
<meta property="og:title" content="Joan Labbé">
<meta property="og:description" content="Call, text, or connect on Facebook.">
<title>Joan Labbé E-Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Layout: flip card on a deep-blue field. Front = sky-blue header with Joan's round portrait, name, call/text/Facebook. Back = two scan codes (phone, Facebook). Palette: Joan's #1780e6 and #65cef7. Single deliberate look. */
  :root {
    color-scheme: dark;
    --deep: #0a2d55;
    --blue: #1780e6;
    --sky: #65cef7;
    --sky-soft: #d9f3fd;
    --paper: #f5fbff;
    --ink: #0b2440;
    --muted: #4f6782;
    --line: #cfe4f5;
    --white: #ffffff;
    --font-display: "Outfit", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, #135fae 0%, var(--deep) 60%, #061b33 100%) fixed, var(--deep);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button, a { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .bar { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bar-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--sky); font-weight: 700; }
  .bar-actions { display: flex; gap: 6px; }
  .chip { border: 1px solid rgba(101,206,247,.55); background: rgba(255,255,255,.08); color: var(--paper); font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .chip:hover { background: rgba(101,206,247,.2); }

  .stage { width: 100%; max-width: 420px; perspective: 1400px; }
  .flip { display: grid; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4,.2,.2,1); }
  .flip.flipped { transform: rotateY(180deg); }
  .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; overflow: hidden; }
  .back { transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) { .flip { transition: none; } }

  /* FRONT */
  .front { background: var(--paper); color: var(--ink); box-shadow: 0 30px 60px -20px rgba(0,0,0,.55), 0 0 0 2px var(--sky); display: flex; flex-direction: column; }
  .sky { height: 112px; background: linear-gradient(135deg, var(--blue) 0%, var(--sky) 100%); position: relative; }
  .sky::before, .sky::after { content: ""; position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); }
  .sky::before { width: 180px; height: 180px; right: -50px; top: -70px; }
  .sky::after { width: 110px; height: 110px; left: -30px; bottom: -60px; }
  .portrait { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; display: block; margin: -70px auto 0; border: 5px solid var(--paper); box-shadow: 0 0 0 3px var(--sky), 0 12px 24px -10px rgba(10,45,85,.5); position: relative; background: var(--sky-soft); }

  .who { padding: 12px 22px 4px; text-align: center; }
  .who h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0; color: var(--ink); letter-spacing: -.01em; }
  .who .phone { margin-top: 6px; font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--blue); font-variant-numeric: tabular-nums; user-select: text; }

  .actions { margin: 16px 22px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 10px; border-radius: 14px; font-size: 14.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 0; }
  .btn-blue { background: var(--blue); color: var(--white); box-shadow: 0 8px 16px -8px rgba(23,128,230,.7); }
  .btn-blue:hover { background: #106fcc; }
  .btn-line { background: var(--white); color: var(--blue); border: 2px solid var(--sky); }
  .btn-line:hover { background: var(--sky-soft); }

  .fb { margin: 10px 22px 0; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 13px; border-radius: 14px; background: var(--white); border: 1.5px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14.5px; font-weight: 700; }
  .fb:hover { border-color: var(--blue); }
  .fb svg { color: #1877f2; }

  .row { margin: 12px 22px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--sky-soft); }
  .row-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ico { width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--white); color: var(--blue); display: grid; place-items: center; }
  .row-text { min-width: 0; }
  .row-text small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .row-text span { display: block; font-size: 15px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; user-select: text; }
  .copy { flex: none; background: var(--white); border: 0; padding: 8px; border-radius: 10px; color: var(--blue); cursor: pointer; }
  .copy:hover { background: var(--sky); color: var(--white); }

  .foot { margin: 16px 22px 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .foot .btn { padding: 12px 6px; font-size: 13px; }
  .btn-deep { background: var(--deep); color: var(--paper); }
  .btn-deep svg { color: var(--sky); }
  .btn-soft { background: var(--sky-soft); color: var(--blue); }

  /* BACK */
  .back { background: linear-gradient(160deg, var(--blue) 0%, #0d5fb3 100%); box-shadow: 0 30px 60px -20px rgba(0,0,0,.55), 0 0 0 2px var(--sky); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
  .back-head { display: flex; align-items: center; gap: 12px; }
  .back-head img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid var(--sky); flex: none; }
  .back-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; color: var(--white); line-height: 1.1; }
  .back-head p { margin: 3px 0 0; font-size: 12px; color: var(--sky-soft); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .qr-card { background: var(--paper); border-radius: 18px; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .qr-box { background: var(--white); padding: 8px; line-height: 0; border-radius: 10px; border: 2px solid var(--sky); }
  .qr-box img, .qr-box canvas { width: 140px !important; height: 140px !important; }
  .qr-info { min-width: 0; color: var(--ink); }
  .qr-info small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--blue); }
  .qr-info h3 { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.1; margin: 3px 0 4px; }
  .qr-info span { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .btn-white { background: var(--white); color: var(--blue); }
  @media (max-width: 360px) { .qr-card { grid-template-columns: 1fr; justify-items: center; text-align: center; } }

  .credit { font-size: 11px; color: rgba(245,251,255,.65); text-align: center; letter-spacing: .04em; }
  .credit b { color: var(--sky); font-weight: 700; }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; background: var(--deep); color: var(--paper); border: 2px solid var(--sky); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; transition: all .3s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>

</head>

  </div>
</header>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  var flipped = false;
  function flip() {
    flipped = !flipped;
    document.getElementById('card').classList.toggle('flipped', flipped);
    document.getElementById('flip-top').textContent = flipped ? 'Show Front' : 'Flip to QR';
  }
  ['flip-top', 'flip-front', 'flip-back'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', flip);
  });

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function copyText(text, msg) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        toast(msg);
      } catch (e) { toast(text); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, fallback);
    } else { fallback(); }
  }
  document.getElementById('copy-phone').addEventListener('click', function () {
    copyText('5167701424', 'Phone number copied');
  });

  function shareCard() {
    var data = { title: 'Joan Labbé', text: 'Joan Labbé, (516) 770-1424', url: location.href };
    if (navigator.share) {
      navigator.share(data).catch(function () {});
    } else {
      copyText(location.href, 'Card link copied. Paste it in a text or email.');
    }
  }
  document.getElementById('share-top').addEventListener('click', shareCard);
  document.getElementById('share-front').addEventListener('click', shareCard);

  document.getElementById('save-contact').addEventListener('click', function () {
    var vcf = [
      'BEGIN:VCARD', 'VERSION:3.0',
      'N:Labbé;Joan;;;', 'FN:Joan Labbé',
      'TEL;TYPE=CELL,VOICE:+15167701424',
      'URL;TYPE=Facebook:https://www.facebook.com/joan.labbe.94',
      'END:VCARD'
    ].join('\r\n');
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard;charset=utf-8' }));
      a.download = 'Joan_Labbe.vcf';
      document.body.appendChild(a); a.click(); a.remove();
      toast('Contact file downloading');
    } catch (e) { toast('Contact save is not available here'); }
  });

  function renderQRs() {
    if (typeof QRCode === 'undefined') { return; }
    document.querySelectorAll('.qr-box').forEach(function (box) {
      box.innerHTML = '';
      new QRCode(box, {
        text: box.getAttribute('data-qr'),
        width: 256, height: 256,
        colorDark: '#0a2d55', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', renderQRs); } else { renderQRs(); }
</script>
